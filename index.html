        options: ["To keep average router queue lengths small, avoiding buffer bloat and global synchronization", "To disable TCP congestion control", "To force all traffic onto UDP", "To encrypt router tables"], correct: 0,

    // --- APPLICATION STATE ENGINE ---
    const STORAGE_KEY = 'cs26505_cbt_app_state_v6';

    function getInitialState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed.currentQId === 'number') {
            return parsed;
          }
        }
      } catch (e) {}

      return {
        currentQId: 1,
        userAnswers: {},
        markedReview: {},
        visited: { 1: true },
        instantFeedback: true,
        timeLeft: 5400, // 90 minutes
        isSubmitted: false,
        selectedModule: 'ALL',
        paletteStatusFilter: 'ALL',
        searchQuery: ''
      };
    }

    let appState = getInitialState();
    let timerInterval = null;

    function saveAppState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {}
    }

    // Timer Logic
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (appState.isSubmitted) {
          clearInterval(timerInterval);
          return;
        }
        if (appState.timeLeft > 0) {
          appState.timeLeft -= 1;
          saveAppState();
          updateTimerUI();
        } else {
          clearInterval(timerInterval);
          window.confirmSubmitExam();
        }
      }, 1000);
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateTimerUI() {
      const timerEl = document.getElementById('timer-display');
      if (timerEl) {
        timerEl.textContent = formatTime(appState.timeLeft);
        if (appState.timeLeft < 300) {
          timerEl.className = "text-rose-400 font-bold animate-pulse";
        }
      }
    }

    // Calculators & Helpers
    function getLiveStats() {
      let correct = 0;
      let incorrect = 0;
      Object.entries(appState.userAnswers).forEach(([qId, ansOpt]) => {
        const q = QUESTIONS.find(item => item.id === Number(qId));
        if (q) {
          if (ansOpt === q.correct) correct++;
          else incorrect++;
        }
      });
      const attempted = Object.keys(appState.userAnswers).length;
      const accuracy = attempted > 0 ? ((correct / attempted) * 100).toFixed(1) : "0.0";
      const percentage = ((correct / QUESTIONS.length) * 100).toFixed(1);

      return {
        correct,
        incorrect,
        attempted,
        unattempted: QUESTIONS.length - attempted,
        accuracy,
        percentage
      };
    }

    // Get Filtered Questions List based on Module & Search (For Workspace View)
    function getFilteredQuestions() {
      return QUESTIONS.filter(q => {
        if (appState.selectedModule !== 'ALL' && q.module !== appState.selectedModule) {
          return false;
        }
        if (appState.searchQuery.trim() !== '') {
          const qry = appState.searchQuery.toLowerCase().trim();
          const mQ = q.question.toLowerCase().includes(qry);
          const mT = q.topic.toLowerCase().includes(qry);
          const mId = q.id.toString() === qry;
          if (!mQ && !mT && !mId) return false;
        }
        return true;
      });
    }

    // Get Palette Filtered Questions List (Module + Status + Search)
    function getPaletteFilteredList() {
      return QUESTIONS.filter(q => {
        const userAns = appState.userAnswers[q.id];
        const isCorrect = userAns !== undefined && userAns === q.correct;
        const isWrong = userAns !== undefined && userAns !== q.correct;
        const isMarked = !!appState.markedReview[q.id];
        const isAttempted = userAns !== undefined;

        if (appState.selectedModule !== 'ALL' && q.module !== appState.selectedModule) {
          return false;
        }
        if (appState.paletteStatusFilter === 'CORRECT' && !isCorrect) return false;
        if (appState.paletteStatusFilter === 'WRONG' && !isWrong) return false;
        if (appState.paletteStatusFilter === 'MARKED' && !isMarked) return false;
        if (appState.paletteStatusFilter === 'UNATTEMPTED' && isAttempted) return false;

        if (appState.searchQuery.trim() !== '') {
          const qry = appState.searchQuery.toLowerCase().trim();
          const mQ = q.question.toLowerCase().includes(qry);
          const mT = q.topic.toLowerCase().includes(qry);
          const mId = q.id.toString() === qry;
          if (!mQ && !mT && !mId) return false;
        }

        return true;
      });
    }

    // --- GLOBAL EVENT HANDLERS (EXPLICITLY BOUND TO WINDOW) ---
    window.selectOption = function(optIdx) {
      if (appState.isSubmitted) return;
      appState.userAnswers[appState.currentQId] = optIdx;
      appState.visited[appState.currentQId] = true;
      saveAppState();
      renderApp();
    };

    window.clearChoice = function() {
      if (appState.isSubmitted) return;
      delete appState.userAnswers[appState.currentQId];
      saveAppState();
      renderApp();
    };

    window.toggleMarkReview = function() {
      appState.markedReview[appState.currentQId] = !appState.markedReview[appState.currentQId];
      saveAppState();
      renderApp();
    };

    window.jumpToQuestionById = function(qId) {
      const q = QUESTIONS.find(item => item.id === qId);
      if (q) {
        appState.currentQId = q.id;
        appState.visited[q.id] = true;
        saveAppState();
        renderApp();
      }
    };

    window.goToNextQuestion = function() {
      const filtered = getFilteredQuestions();
      if (filtered.length === 0) return;
      const currentPos = filtered.findIndex(q => q.id === appState.currentQId);
      if (currentPos >= 0 && currentPos < filtered.length - 1) {
        window.jumpToQuestionById(filtered[currentPos + 1].id);
      }
    };

    window.goToPrevQuestion = function() {
      const filtered = getFilteredQuestions();
      if (filtered.length === 0) return;
      const currentPos = filtered.findIndex(q => q.id === appState.currentQId);
      if (currentPos > 0) {
        window.jumpToQuestionById(filtered[currentPos - 1].id);
      }
    };

    window.toggleInstantFeedback = function() {
      appState.instantFeedback = !appState.instantFeedback;
      saveAppState();
      renderApp();
    };

    window.setModuleFilter = function(mod) {
      appState.selectedModule = mod;
      const filtered = getFilteredQuestions();
      if (filtered.length > 0) {
        const existsInFiltered = filtered.some(q => q.id === appState.currentQId);
        if (!existsInFiltered) {
          appState.currentQId = filtered[0].id;
          appState.visited[filtered[0].id] = true;
        }
      }
      saveAppState();
      renderApp();
    };

    window.setPaletteStatusFilter = function(st) {
      appState.paletteStatusFilter = st;
      saveAppState();
      renderApp();
    };

    window.setSearchQuery = function(val) {
      appState.searchQuery = val;
      renderApp();
    };

    window.openSubmitModal = function() {
      const stats = getLiveStats();
      const attemptedEl = document.getElementById('modal-attempted-cnt');
      const unansweredEl = document.getElementById('modal-unanswered-cnt');
      const markedEl = document.getElementById('modal-marked-cnt');
      
      if (attemptedEl) attemptedEl.textContent = stats.attempted;
      if (unansweredEl) unansweredEl.textContent = stats.unattempted;
      if (markedEl) markedEl.textContent = Object.keys(appState.markedReview).filter(k => appState.markedReview[k]).length;
      
      const modal = document.getElementById('submit-modal');
      if (modal) modal.classList.remove('hidden');
    };

    window.closeSubmitModal = function() {
      const modal = document.getElementById('submit-modal');
      if (modal) modal.classList.add('hidden');
    };

    window.confirmSubmitExam = function() {
      window.closeSubmitModal();
      appState.isSubmitted = true;
      saveAppState();
      renderApp();
    };

    window.resetExam = function() {
      if (confirm("Are you sure you want to reset all answers and restart the test?")) {
        localStorage.removeItem(STORAGE_KEY);
        appState = getInitialState();
        saveAppState();
        startTimer();
        renderApp();
      }
    };

    window.toggleMobileDrawer = function(open) {
      const drawer = document.getElementById('mobile-drawer');
      if (!drawer) return;
      if (open) {
        drawer.classList.remove('hidden');
        renderMobilePalette();
      } else {
        drawer.classList.add('hidden');
      }
    };

    // Keyboard Navigation Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') window.goToPrevQuestion();
      else if (e.key === 'ArrowRight') window.goToNextQuestion();
    });

    function getPaletteBtnClass(q) {
      const qId = q.id;
      const userAns = appState.userAnswers[qId];
      const isMarked = !!appState.markedReview[qId];
      const isCurrent = appState.currentQId === q.id;
      const isAns = userAns !== undefined;

      let base = "h-9 w-full rounded-lg text-xs font-bold transition flex items-center justify-center relative shadow-sm ";
      if (isCurrent) base += "ring-2 ring-teal-400 ring-offset-2 ring-offset-slate-950 z-10 font-extrabold ";

      if (appState.instantFeedback && isAns) {
        if (userAns === q.correct) {
          return base + "bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/30";
        } else {
          return base + "bg-rose-600 hover:bg-rose-500 text-white shadow-rose-900/30";
        }
      }

      if (isAns && isMarked) return base + "bg-purple-600 hover:bg-purple-500 text-white";
      if (isMarked) return base + "bg-amber-500 hover:bg-amber-400 text-slate-950";
      if (isAns) return base + "bg-teal-600 hover:bg-teal-500 text-white";
      if (appState.visited[qId]) return base + "bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700";

      return base + "bg-slate-900/80 hover:bg-slate-800 text-slate-400 border border-slate-800";
    }

    function renderPaletteGrid() {

                  Question Palette (${list.length})
                </h3>
                <button onclick="window.setSearchQuery(''); window.setPaletteStatusFilter('ALL');" class="text-[10px] text-teal-400 hover:underline font-bold">
                  Reset Filters
                </button>
              </div>

              <input
                type="text"
                placeholder="Search Q# or Topic..."
                value="${appState.searchQuery}"
                oninput="window.setSearchQuery(this.value)"
                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-teal-500 mb-2"
              />

              <div class="flex flex-wrap gap-1 text-[10px]">
                ${['ALL', 'CORRECT', 'WRONG', 'MARKED', 'UNATTEMPTED'].map(st => `
                  <button
                    onclick="window.setPaletteStatusFilter('${st}')"
                    class="px-2 py-0.5 rounded-md font-bold transition ${appState.paletteStatusFilter === st ? 'bg-teal-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}"
                  >
                    ${st}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="grid grid-cols-2 gap-1.5 text-[11px] mb-3 pb-3 border-b border-slate-800">
              <div class="flex items-center space-x-1.5"><div class="w-3 h-3 rounded-md bg-emerald-600"></div><span class="text-slate-400">Correct</span></div>
              <div class="flex items-center space-x-1.5"><div class="w-3 h-3 rounded-md bg-rose-600"></div><span class="text-slate-400">Incorrect</span></div>
              <div class="flex items-center space-x-1.5"><div class="w-3 h-3 rounded-md bg-amber-500"></div><span class="text-slate-400">Marked</span></div>
              <div class="flex items-center space-x-1.5"><div class="w-3 h-3 rounded-md bg-slate-900 border border-slate-800"></div><span class="text-slate-400">Unattempted</span></div>
            </div>

            <div class="flex-1 overflow-y-auto max-h-[460px] pr-1">
              <div class="grid grid-cols-5 gap-2">
                ${gridHTML}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMobilePalette() {
      const container = document.getElementById('mobile-palette-container');
      if (!container) return;
      const list = getPaletteFilteredList();
      const gridHTML = list.length > 0 ? list.map(q => `
        <button
          onclick="window.jumpToQuestionById(${q.id}); window.toggleMobileDrawer(false);"
          class="${getPaletteBtnClass(q)}"
        >
          ${q.id}
        </button>
      `).join('') : `<p class="col-span-5 text-xs text-slate-500 py-4 text-center">No questions match filters.</p>`;

      container.innerHTML = `
        <div class="space-y-3">
          <input
            type="text"
            placeholder="Search Q# or Topic..."
            value="${appState.searchQuery}"
            oninput="window.setSearchQuery(this.value)"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-teal-500"
          />
          <div class="grid grid-cols-5 gap-2">
            ${gridHTML}
          </div>
        </div>
      `;
    }

    function renderScorecardDashboard() {
      const stats = getLiveStats();

      // Calculate Module Specifics
      const modStats = {
        "Module 3": { total: 0, correct: 0, title: "IPv6, Multicast, MPLS & Mobile IP" },
        "Module 4": { total: 0, correct: 0, title: "UDP, TCP, RPC & RTP Protocols" },
        "Module 5": { total: 0, correct: 0, title: "Congestion Control, QoS & Traffic Shaping" }
      };

      QUESTIONS.forEach(q => {
        modStats[q.module].total += 1;
        const userAns = appState.userAnswers[q.id];
        if (userAns !== undefined && userAns === q.correct) {
          modStats[q.module].correct += 1;
        }
      });

      const isPassed = Number(stats.percentage) >= 60;

      return `
        <div class="max-w-7xl w-full mx-auto p-4 sm:p-8 space-y-8 animate-fade-in">
          <div class="ed-card rounded-3xl p-6 sm:p-10 border border-teal-500/30 bg-gradient-to-r from-slate-900 via-teal-950/30 to-slate-900 shadow-2xl">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 items-center">
              
              <!-- SCORE BADGE -->
              <div class="lg:col-span-1 text-center border-b lg:border-b-0 lg:border-r border-slate-800 pb-6 lg:pb-0 lg:pr-8">
                <div class="inline-flex flex-col items-center justify-center w-36 h-36 rounded-full bg-slate-950 border-4 ${isPassed ? 'border-emerald-500 shadow-emerald-500/30' : 'border-rose-500 shadow-rose-500/30'} shadow-2xl mb-4">
                  <span class="text-4xl font-black text-white">${stats.correct}</span>
                  <span class="text-xs font-bold text-teal-400 uppercase tracking-widest">Out of 100</span>
                </div>
                <h3 class="text-xl font-extrabold text-slate-100">
                  ${isPassed ? '🏆 Test Passed!' : '📚 Revision Needed'}
                </h3>
                <p class="text-xs text-slate-400 mt-1">Overall Percentage: ${stats.percentage}%</p>
              </div>

              <!-- DETAILED METRICS -->
              <div class="lg:col-span-3 space-y-6">
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 text-center">
                    <span class="text-xs font-bold text-slate-400 block mb-1">Attempted</span>
                    <span class="text-2xl font-black text-white">${stats.attempted}</span>
                  </div>
                  <div class="bg-emerald-950/40 p-4 rounded-2xl border border-emerald-800/50 text-center">
                    <span class="text-xs font-bold text-emerald-400 block mb-1">Correct</span>
                    <span class="text-2xl font-black text-emerald-300">${stats.correct}</span>
                  </div>
                  <div class="bg-rose-950/40 p-4 rounded-2xl border border-rose-800/50 text-center">
                    <span class="text-xs font-bold text-rose-400 block mb-1">Incorrect</span>
                    <span class="text-2xl font-black text-rose-300">${stats.incorrect}</span>
                  </div>
                  <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 text-center">
                    <span class="text-xs font-bold text-teal-400 block mb-1">Accuracy</span>
                    <span class="text-2xl font-black text-teal-300">${stats.accuracy}%</span>
                  </div>
                </div>

                <!-- MODULE BREAKDOWN -->
                <div class="space-y-4">
                  <h4 class="text-sm font-bold text-slate-200 uppercase tracking-wider">
                    Module-Wise Performance Breakdown
                  </h4>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    ${Object.entries(modStats).map(([modKey, modInfo]) => {
                      const pct = modInfo.total > 0 ? ((modInfo.correct / modInfo.total) * 100).toFixed(0) : 0;
                      return `
                        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-extrabold text-teal-400">${modKey}</span>
                            <span class="text-xs font-bold text-slate-300">${modInfo.correct}/${modInfo.total} (${pct}%)</span>
                          </div>
                          <p class="text-[11px] text-slate-400 truncate">${modInfo.title}</p>
                          <div class="w-full h-2 rounded-full bg-slate-950 overflow-hidden">
                            <div class="h-full bg-teal-500 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div class="flex items-center justify-end space-x-4 pt-2">
                  <button
                    onclick="window.resetExam()"
                    class="px-6 py-3 rounded-2xl bg-teal-600 hover:bg-teal-500 text-white font-extrabold text-sm shadow-xl shadow-teal-600/30 transition"
                  >
                    Retake Test
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
      `;
    }

    function renderApp() {
      renderHeader();
      const root = document.getElementById('app-root');
      if (!root) return;

      if (!appState.isSubmitted) {
        root.className = "flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6";
        root.innerHTML = renderQuestionWorkspace() + renderPaletteGrid();
      } else {
        root.className = "flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8 space-y-8";
        root.innerHTML = renderScorecardDashboard();
      }
    }

    // INITIALIZE APP ON LOAD
    window.onload = function() {
      startTimer();
      renderApp();
    };
  </script>
</body>
</html>
